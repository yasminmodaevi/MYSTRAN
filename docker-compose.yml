version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aeroplm
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/aeroplm
      VAULT_PATH: /app/vault
    volumes:
      - ./vault:/app/vault
    depends_on:
      - db

volumes:
  postgres_data:
